<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maze Generator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <canvas id="canvas"></canvas>

    <div class="actions">
      <h2>Maze Controls</h2>
      <label for="algo-selector">Algorithm:</label>
      <select id="algo-selector">
        <option value="dfs">Depth First Search</option>
        <option value="binary-tree">Binary Tree</option>
        <option value="random-walk">Aldous-Broder</option>
        <option value="prims">Prim's</option>
        <option value="kruskals">Kruskal's</option>
        <option value="hunt-kill">Hunt & Kill</option>
      </select>

      <button id="generate" class="btn">Generate</button>
      <button id="solver" class="btn">Solve</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
